services:
  db:
    build: ./app/bdd
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: counterdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - monReseau

  app-flask:
    build: ./app
    container_name: app-flask
    restart: always
    networks:
      - monReseau
    depends_on:
      - db

  phpmyadmin:
    build: ./app/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: user
      PMA_PASSWORD: password
    networks:
      - monReseau
    depends_on:
      - db

  calculatrice:
    build: ./web
    container_name: calculatrice
    networks:
     - monReseau

  tests:
    build: ./ci
    container_name: tests
    depends_on:
      - calculatrice
      - app-flask
    networks:
      - monReseau

  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - monReseau
    depends_on:
      - calculatrice
      - app-flask
      - phpmyadmin
      - grafana

  prometheus:
    build: ./monitoring/prometheus
    container_name: prometheus
    restart: always
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monReseau
    ports:
      - "9090:9090"
    depends_on:
      - app-flask
      - calculatrice

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - monReseau
    restart: always

  promtail:
    build: ./monitoring/promtail
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monReseau
    ports:
      - "9080:9080"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monReseau
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  monReseau:
