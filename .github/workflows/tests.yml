name: CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  COMPOSE_PROJECT_NAME: "ci_gh_${{ github.run_id }}"
  NGINX_PORT: ${{ secrets.NGINX_PORT }}
  GRAFANA_PORT: ${{ secrets.GRAFANA_PORT }}
  PROMETHEUS_PORT: ${{ secrets.PROMETHEUS_PORT }}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run : |
          sudo apt install docker-compose
          bash tests.sh
